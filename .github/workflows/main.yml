name: Android Debug APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android project root
        run: |
          echo "Repository contents at root:"
          ls -la

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "OK: settings.gradle(.kts) found at repository root."
          else
            echo "ERROR: settings.gradle.kts was not found at the repository root."
            echo "This means the Android project is nested in a subfolder, or"
            echo "the project files were not committed correctly."
            echo "Searching the repo for it..."
            find . -maxdepth 4 -name "settings.gradle*" -not -path "*/build/*"
            exit 1
          fi

      - name: Show Gradle and Java versions
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Locate built APK(s)
        run: find . -name "*.apk" -path "*/outputs/apk/*"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jyoti-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
